    <script>
      // Boucle de 12 s : chaque mouvement revient à l'état de l'image 0,
      // qui sert aussi d'image fixe quand les animations sont réduites.
      const PERIOD = 1400;
      const RED = { start: 1.0, duration: 5.2 };
      const BLACK = { start: 5.0, duration: 5.6 };
      // Glissement des triangles le long de leur diagonale, vers leur coin
      const SLIDE_RED = 18.38;
      const SLIDE_BLACK = 11.31;

      const tl = gsap.timeline({ paused: true });

      // Coupures : le ruban rouge d'abord, puis le noir, dans le sens d'écriture du S
      tl.fromTo(
        "#mask-red-path",
        { attr: { "stroke-dashoffset": 0 } },
        { attr: { "stroke-dashoffset": -PERIOD }, duration: RED.duration, ease: "sine.inOut" },
        RED.start,
      );
      tl.fromTo(
        "#mask-black-path",
        { attr: { "stroke-dashoffset": 0 } },
        { attr: { "stroke-dashoffset": -PERIOD }, duration: BLACK.duration, ease: "sine.inOut" },
        BLACK.start,
      );

      // Aller-retour sur toute la boucle : au coin à 6 s, de retour à 12 s.
      // Le noir bouge moins que le rouge pour donner un léger décalage de plans.
      const slide = (target, d) =>
        tl.fromTo(
          target,
          { x: 0, y: 0 },
          { x: d, y: d, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 },
          0,
        );
      slide("#tri-tl-red", -SLIDE_RED);
      slide("#tri-tl-black", -SLIDE_BLACK);
      slide("#tri-br-red", SLIDE_RED);
      slide("#tri-br-black", SLIDE_BLACK);

      window.__timelines["main"] = tl;
    </script>
